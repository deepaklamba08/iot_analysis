<!DOCTYPE html>
<html>
<head>
    <script src="{{url_for('static', filename='app_script.js')}}"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

    <style>
        html, body { height: 100%; margin: 10; }
        body { display: flex; align-items: center; justify-content: center; background-color: #f9f9f9; padding: 30px; }
        .createJobDetailsLabel { color: white; font-weight: 400; text-align: center; }
        .detail-span { display: inline-block; width: 100%; padding: 6px 10px; background-color: #f1f1f1; border-radius: 4px; min-height: 34px; }
        #appElementsTable { border-collapse: collapse; width: 100%; }
        #appElementsTable th { background-color: #337ab7; color: white; }
        .centered-panel { margin-top: 10px; max-width: 900px; width: 100%; }
        .bottom-button { margin-top: 20px; text-align: center; }
    </style>
</head>

<body onload="initCreateJobPage()">

<div class="panel panel-primary centered-panel">
    <div class="panel-heading">
        <label id="createJobDetailsLabel" class="createJobDetailsLabel">Create Job</label>
    </div>

    <div class="panel-body" id="createJobDetailsSection">

        <div class="row form-group">
            <div class="col-sm-3"><strong>Select Application:</strong></div>
            <div class="col-sm-9">
                <select id="applicationSelect" class="form-control">
                    <option>Application</option>
                </select>
            </div>
        </div>

        <div class="row form-group">
            <div class="col-sm-3"><strong>Job Name:</strong></div>
            <div class="col-sm-9"><input id="jobNameField" class="detail-span"></div>
        </div>

        <div class="row form-group">
            <div class="col-sm-3"><strong>Select Scheduler:</strong></div>
            <div class="col-sm-9">
                <select id="jobSchedulerSelect" class="form-control">
                </select>
            </div>
        </div>

        <div class="row form-group">
            <div class="col-sm-3"><strong>Description:</strong></div>
            <div class="col-sm-9"><input id="jobDescriptionField" class="detail-span"></div>
        </div>

        <div class="row form-group">
            <div class="col-sm-3"><strong>Configuration:</strong></div>
            <div class="col-sm-9">
                <textarea id="jobConfig" class="form-control" width="100%" rows="3" style="resize: none;"></textarea>
            </div>
        </div>

        <hr>
        <h4>Application Elements</h4>
        <div class="table-responsive">
            <table class="table table-bordered table-striped" id="appElementsTable">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Description</th>
                </tr>
                </thead>
                <tbody id="createAppElementsTableBody"></tbody>
            </table>
        </div>

        <div class="bottom-button">
            <button type="button" class="btn btn-primary" onclick="createJob()">Create Job</button>
            <button type="button" class="btn btn-primary" onclick="closePage()">Close</button>
        </div>
    </div>
</div>

<!-- Message Modal -->
<div id="messageModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="messageModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header"><h4 class="modal-title" id="messageModalLabel">Info</h4></div>
            <div class="modal-body"><p id="messageModalBody">Your message goes here.</p></div>
            <div class="modal-footer"><button type="button" class="btn btn-default" data-dismiss="modal">OK</button></div>
        </div>
    </div>
</div>

</body>
</html>
