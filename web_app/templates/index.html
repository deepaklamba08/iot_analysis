<html>
<head>
    <script src="{{url_for('static', filename='app_script.js')}}"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <style>

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background-color: #f9f9f9;
            padding: 10px;
        }

        .appDetailsLabel {
            color: white;
            font-weight: 400;
            text-align: center;
        }

        .sidebar {
            background-color: #f5f5f5;
            padding: 15px;
            height: 100%;
            border-right: 1px solid #ddd;
        }

        .sidebar button {
            display: block;
            width: 100%;
            margin-bottom: 10px;
        }

        .main-content {
            padding-left: 25px;
        }

         .form-group span {
            background-color: #e9ecef; /* Light gray for non-editable labels */
        }
        .detail-span {
            display: inline-block;
            width: 100%;
            padding: 6px 10px;
            background-color: #f1f1f1;
            border-radius: 4px;
            min-height: 34px;
        }

        #applicationElementsTable th,
        #applicationElementsTable td {
            border: 1px solid #999;
            padding: 8px;
            text-align: left;
        }

        #applicationElementsTable {
            border-collapse: collapse;
            width: 100%;
        }

        #applicationElementsTable th {
            background-color: #337ab7;
            color: white;
        }




    </style>
</head>

<body onload="initIndexPage()">

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-sm-3 sidebar">
            <h4>Actions</h4>
            <p>Select Job :</p>
            <select id="jobNames" class="form-control">
                <option>Available Jobs</option>
            </select>
            <br>
            <button class="btn btn-primary" onclick="applicationDetails()">Application Details</button>
            <button class="btn btn-primary" onclick="openJobDetailsPage()">Job Details</button>
            <button class="btn btn-primary" onclick="openJobHistoryPage()">Load History</button>
            <button class="btn btn-primary" onclick="openSchedulerPage()">Scheduler</button>
            <button class="btn btn-primary" onclick="openCreateAppPage()">Create Application</button>
            <button class="btn btn-primary">Create Job</button>
            <button class="btn btn-danger" onclick="window.location.href='{{ url_for('logout') }}'">Logout</button>

        </div>

        <!-- Main Content -->
        <div class="col-sm-9 main-content">
            <div class="panel panel-primary">
                <div class="panel-heading">
                    <label id="appDetailsLabel" class="appDetailsLabel">Application Details</label>
                </div>
                <div class="panel-body" id="applicationDetailsSection">

                    <div class="row form-group">
                        <div class="col-sm-3"><strong>Application Name:</strong></div>
                        <div class="col-sm-9"><span id="appNameLabel" class="detail-span"></span></div>
                    </div>

                    <div class="row form-group">
                        <div class="col-sm-3"><strong>Description:</strong></div>
                        <div class="col-sm-9"><span id="appDescriptionLabel" class="detail-span"></span></div>
                    </div>

                    <div class="row form-group">
                        <div class="col-sm-3"><strong>Status:</strong></div>
                        <div class="col-sm-9"><span id="appStatusLabel" class="detail-span"></span></div>
                    </div>

                    <div class="row form-group">
                        <div class="col-sm-3"><strong>Create Date:</strong></div>
                        <div class="col-sm-9"><span id="appCreateDateLabel" class="detail-span"></span></div>
                    </div>

                    <div class="row form-group">
                        <div class="col-sm-3"><strong>Last Modified:</strong></div>
                        <div class="col-sm-9"><span id="appLastModifiedLabel" class="detail-span"></span></div>
                    </div>

                    <div class="row form-group">
                        <div class="col-sm-3"><strong>Owner:</strong></div>
                        <div class="col-sm-9"><span id="appOwnerLabel" class="detail-span"></span></div>
                    </div>
                    <hr>
                    <h4>Application Elements</h4>
                    <div class="table-responsive">
                        <table class="table table-bordered table-striped" id="applicationElementsTable">
                            <thead>
                            <tr>
                                <th>Element Name</th>
                                <th>Object</th>
                                <th>Type</th>
                                <th>Description</th>
                            </tr>
                            </thead>
                            <tbody id="applicationElementsBody">
                            </tbody>
                        </table>
                    </div>

                    <hr>
                    <h4>Application Configuration</h4>
                    <div class="panel-body">
                        <textarea id="appConfigurationText" class="form-control" rows="6" readonly
                                  style="resize: none;"></textarea>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>


<!-- Modal for Source Details -->
<div id="sourceDetailsModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="sourceDetailsLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">

            <div class="modal-header">
                <h4 class="modal-title" id="sourceDetailsModalLabel">Source</h4>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">OK</button>
            </div>

        </div>
    </div>
</div>

<!-- Modal for Transformation Details -->
<div id="transformationDetailsModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="transformationDetailsLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">

            <div class="modal-header">
                <h4 class="modal-title" id="transformationDetailsModalLabel">Transformation</h4>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">OK</button>
            </div>

        </div>
    </div>
</div>

<!-- Modal for Action Details -->
<div id="actionDetailsModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="actionDetailsLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">

            <div class="modal-header">
                <h4 class="modal-title" id="actionDetailsModalLabel">Action</h4>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">OK</button>
            </div>

        </div>
    </div>
</div>
</body>
</html>
